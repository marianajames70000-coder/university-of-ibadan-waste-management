{% extends 'base.html' %}{% block body %}<h1>Bin monitoring</h1><p class="muted">Levels come from bin sensors; here they can be set by hand (sensor simulation).</p><div class="card"><table><tr><th>Bin</th><th>Zone</th><th>Type</th><th>Capacity</th><th>Fill</th><th>Update</th></tr>
{% for b in bins %}<tr><td>{{ b.label }}</td><td>{{ b.zone }}</td><td>{{ b.kind }}</td><td>{{ b.capacity_l }} L</td><td><meter min="0" max="100" low="60" high="{{ th-1 }}" optimum="10" value="{{ b.fill_pct }}"></meter> {{ b.fill_pct }}%</td>
<td><form class="inline" method="post" action="{{ url_for('staff.set_fill', bid=b.id) }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input name="fill_pct" type="number" min="0" max="100" aria-label="Fill level"><button class="btn sm">Set</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
