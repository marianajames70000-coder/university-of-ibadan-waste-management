{% extends 'base.html' %}{% block body %}<h1>Users</h1><div class="card"><h2>Add staff</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="create"><div class="two"><div><label for="name">Name</label><input id="name" name="name"><label for="email">Email</label><input id="email" name="email" type="email"></div><div><label for="role">Role</label><select id="role" name="role"><option>collector</option><option>admin</option></select><label for="password">Password</label><input id="password" name="password" type="password"></div></div><p><button class="btn">Create</button></p></form></div>
<div class="card"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Zone</th><th></th></tr>{% for u in rows %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.zone or '' }}</td><td>{% if u.active and u.id!=user.id %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="deactivate"><input type="hidden" name="uid" value="{{ u.id }}"><button class="btn sm red">Deactivate</button></form>{% elif not u.active %}<span class="muted">inactive</span>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
