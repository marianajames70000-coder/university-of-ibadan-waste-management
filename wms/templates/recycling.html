{% extends 'base.html' %}{% block body %}<h1>Recycling log</h1><div class="two"><div class="card"><h2>Record a delivery</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="zone_id">Zone</label><select id="zone_id" name="zone_id">{% for z in zones %}<option value="{{ z.id }}">{{ z.name }}</option>{% endfor %}</select>
<label for="material">Material</label><select id="material" name="material">{% for m in materials %}<option>{{ m }}</option>{% endfor %}</select><label for="kg">Weight (kg)</label><input id="kg" name="kg" type="number" step="0.1" min="0.1"><p><button class="btn">Save</button></p></form></div>
<div class="card"><h2>Totals by material</h2><table><tr><th>Material</th><th>kg</th></tr>{% for t in tot %}<tr><td>{{ t.material }}</td><td>{{ t.kg }}</td></tr>{% endfor %}</table></div></div>{% endblock %}
