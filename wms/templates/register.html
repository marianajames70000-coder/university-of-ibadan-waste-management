{% extends 'base.html' %}{% block body %}<div class="card narrow"><h1>Register as a resident</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="name">Full name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="phone">Phone</label><input id="phone" name="phone">
<label for="zone_id">Your zone</label><select id="zone_id" name="zone_id" required>{% for z in zones %}<option value="{{ z.id }}">{{ z.name }}</option>{% endfor %}</select>
<label for="password">Password (8+ characters, letters and digits)</label><input id="password" name="password" type="password" required><p><button class="btn">Create account</button></p></form></div>{% endblock %}
