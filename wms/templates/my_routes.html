{% extends 'base.html' %}{% block body %}<h1>My routes</h1><div class="card"><table><tr><th>#</th><th>Date</th><th>Zone</th><th>Progress</th><th>Distance</th><th>Status</th></tr>{% for r in routes %}<tr><td><a href="{{ url_for('staff.route_detail', rid=r.id) }}">{{ r.id }}</a></td><td>{{ r.route_date }}</td><td>{{ r.zone }}</td><td>{{ r.done_n }} / {{ r.stops }} stops</td><td>{{ '%.1f'|format(r.distance_km) }} km</td><td><span class="badge {{ r.status }}">{{ r.status }}</span></td></tr>{% else %}<tr><td colspan="6" class="muted">No routes assigned.</td></tr>{% endfor %}</table></div>{% endblock %}
